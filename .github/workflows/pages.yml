name: Deploy Quantum OS Web Edition
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  verify-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Run acceptance contract tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate manifest
        run: python3 -m json.tool manifest.webmanifest
      - name: Assemble public site
        run: |
          mkdir -p dist
          cp index.html styles.css app.js sw.js manifest.webmanifest icon.svg dist/
          cp README.md dist/ABOUT.md
          (cd dist && sha256sum index.html styles.css app.js sw.js manifest.webmanifest icon.svg > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
