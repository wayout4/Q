name: Deploy Quantum OS Web Edition
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  verify-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check quantum-config.js
          node --check q-number-worker/src/index.js
          node --check quantum-sim/simulator.js
          node --check oeql/runtime.mjs
      - name: Run static acceptance tests
        run: python3 -m unittest discover -s tests -v
      - name: Test quantum state-vector simulator
        run: node --test quantum-sim/simulator.test.mjs
      - name: Test OEQL runtime
        run: node --test oeql/runtime.test.mjs
      - name: Test Q# assignment API
        run: node --test tests/q-number-worker.test.mjs
      - name: Validate manifest
        run: python3 -m json.tool manifest.webmanifest
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Run browser end-to-end acceptance tests
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/quantum-os-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/e2e.mjs
      - name: Assemble public site
        run: |
          mkdir -p dist
          cp index.html styles.css immersive.css app.js sw.js manifest.webmanifest icon.svg quantum-config.js dist/
          cp README.md dist/ABOUT.md
          cp -R quantum-sim oeql dist/
          (cd dist && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
