name: Quantum OS acceptance checks
on:
  push:
    branches: [main, quantum-os-foundation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check quantum-config.js
          node --check q-number-worker/src/index.js
          node --check oeql/runtime.mjs
          node --check quantum-sim/simulator.js
      - name: Run static acceptance contract tests
        run: python3 -m unittest discover -s tests -v
      - name: Test quantum state-vector simulator
        run: node --test quantum-sim/simulator.test.mjs
      - name: Test OEQL runtime
        run: node --test oeql/runtime.test.mjs
      - name: Test Q# assignment API
        run: node --test tests/q-number-worker.test.mjs
      - name: Validate web manifest JSON
        run: python3 -m json.tool manifest.webmanifest
      - name: Install Playwright browser test dependency
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Run browser end-to-end acceptance tests
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/quantum-os-http.log 2>&1 &
          echo $! > /tmp/quantum-os-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/e2e.mjs
      - name: Check required assets and relative paths
        run: |
          test -s index.html
          test -s styles.css
          test -s immersive.css
          test -s app.js
          test -s quantum-config.js
          test -s quantum-sim/simulator.js
          test -s q-number-worker/src/index.js
          test -s sw.js
          test -s icon.svg
          grep -q 'href="./styles.css"' index.html
          grep -q 'href="./immersive.css"' index.html
          grep -q 'src="./app.js"' index.html
          grep -q 'src="./quantum-config.js"' index.html
          grep -q 'src="./quantum-sim/simulator.js"' index.html
          grep -q 'navigator.onLine' app.js
      - name: Package static web app
        run: |
          mkdir -p dist
          cp index.html styles.css immersive.css app.js sw.js manifest.webmanifest icon.svg quantum-config.js README.md dist/
          cp -R quantum-sim oeql dist/
          (cd dist && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Upload verified web package
        uses: actions/upload-artifact@v4
        with:
          name: quantum-os-web
          path: dist/
          if-no-files-found: error
          retention-days: 30
