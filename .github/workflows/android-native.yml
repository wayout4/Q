name: QOS Android native build
on:
  push:
    branches: [main]
    paths:
      - "native/android/**"
      - ".github/workflows/android-native.yml"
  pull_request:
    paths:
      - "native/android/**"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build native Android debug APK
        working-directory: native/android
        run: gradle --no-daemon assembleDebug
      - name: Verify APK exists
        run: test -s native/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: qos-android-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
